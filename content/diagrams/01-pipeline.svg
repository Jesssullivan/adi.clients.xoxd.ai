<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 1200 450" role="img" aria-labelledby="d01pipe-t d01pipe-d" font-family="inherit">
  <title id="d01pipe-t">The pipeline as a data flow diagram</title>
  <desc id="d01pipe-d">Ovals are processes and rectangles are data. The pipeline creates the queue and spawns or stops the senders. The producer puts messages on the queue at the rate lambda and blocks when C are queued. Each of the M senders takes one message from the queue atomically, sends it, and commits its Summary to the stats. Every T the monitor reads the stats and writes a line to the display; the pipeline reads the same numbers and the offered rate lambda to set the number of senders.</desc>
  <defs>
    <marker id="d01pipe-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="d01pipe-arr-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--deck-hl)"/>
    </marker>
  </defs>

  <!-- pipeline (process) -->
  <ellipse cx="135" cy="90" rx="110" ry="42" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="135" y="86" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">Pipeline</text>
  <text x="135" y="110" font-size="14" text-anchor="middle" style="fill: var(--deck-muted)">P from offered λ·E[τ]/M</text>

  <!-- queue (data) -->
  <rect x="430" y="50" width="300" height="80" fill="none" stroke-width="2" style="stroke: var(--deck-hl)"/>
  <text x="580" y="80" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">Queue</text>
  <g stroke="currentColor" stroke-opacity="0.6" style="fill: var(--deck-hl); fill-opacity: 0.3">
    <rect x="490" y="92" width="30" height="26"/><rect x="525" y="92" width="30" height="26"/>
    <rect x="560" y="92" width="30" height="26"/><rect x="595" y="92" width="30" height="26"/>
  </g>
  <text x="680" y="111" font-size="14" text-anchor="middle" style="fill: var(--deck-muted)">at most C</text>
  <line x1="245" y1="90" x2="426" y2="90" stroke="currentColor" stroke-width="2" marker-end="url(#d01pipe-arr)"/>
  <text x="335" y="80" font-size="15" text-anchor="middle" fill="currentColor">creates</text>

  <!-- producer (process) -->
  <ellipse cx="1045" cy="90" rx="138" ry="42" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="1045" y="86" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">Producer</text>
  <text x="1045" y="110" font-size="14" text-anchor="middle" style="fill: var(--deck-muted)">Message(id, body, created_us)</text>
  <line x1="906" y1="90" x2="734" y2="90" stroke="currentColor" stroke-width="2" marker-end="url(#d01pipe-arr)"/>
  <text x="822" y="80" font-size="15" text-anchor="middle" fill="currentColor">put at λ(t)</text>
  <text x="822" y="112" font-size="14" text-anchor="middle" style="fill: var(--deck-hl)">blocks at C</text>

  <!-- senders (processes) -->
  <g stroke="currentColor" stroke-width="2" fill="none" marker-end="url(#d01pipe-arr)">
    <line x1="560" y1="130" x2="380" y2="207"/>
    <line x1="580" y1="130" x2="600" y2="203"/>
    <line x1="600" y1="130" x2="880" y2="207"/>
  </g>
  <text x="800" y="160" font-size="15" text-anchor="start" fill="currentColor">get, atomic</text>
  <path d="M135,132 L135,245 L232,245" fill="none" stroke-width="2" stroke-dasharray="7 5" style="stroke: var(--deck-hl)" marker-end="url(#d01pipe-arr-acc)"/>
  <text x="128" y="190" font-size="15" text-anchor="end" style="fill: var(--deck-hl)">spawn,</text>
  <text x="128" y="210" font-size="15" text-anchor="end" style="fill: var(--deck-hl)">stop</text>
  <ellipse cx="340" cy="245" rx="105" ry="38" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="340" y="242" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">Sender 1</text>
  <text x="340" y="264" font-size="13" text-anchor="middle" style="fill: var(--deck-muted)">get, send, done</text>
  <ellipse cx="600" cy="245" rx="105" ry="38" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="600" y="242" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">Sender 2</text>
  <text x="600" y="264" font-size="13" text-anchor="middle" style="fill: var(--deck-muted)">get, send, done</text>
  <text x="745" y="252" font-size="24" text-anchor="middle" fill="currentColor">⋯</text>
  <ellipse cx="900" cy="245" rx="105" ry="38" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="900" y="242" font-size="18" font-weight="700" text-anchor="middle" fill="currentColor">Sender M</text>
  <text x="900" y="264" font-size="13" text-anchor="middle" style="fill: var(--deck-muted)">get, send, done</text>

  <!-- stats (data) -->
  <g stroke="currentColor" stroke-width="2" fill="none" marker-end="url(#d01pipe-arr)">
    <line x1="340" y1="283" x2="420" y2="346"/>
    <line x1="600" y1="283" x2="600" y2="346"/>
    <line x1="900" y1="283" x2="780" y2="346"/>
  </g>
  <text x="640" y="320" font-size="15" text-anchor="start" fill="currentColor">done(msg, Summary)</text>
  <rect x="330" y="350" width="540" height="80" fill="none" stroke-width="2" style="stroke: var(--deck-hl)"/>
  <text x="600" y="382" font-size="22" font-weight="700" text-anchor="middle" fill="currentColor">Stats</text>
  <text x="600" y="410" font-size="14" text-anchor="middle" style="fill: var(--deck-muted)">one commit per message, each sender's Summary</text>

  <!-- monitor (process) and display (data) -->
  <ellipse cx="1000" cy="390" rx="85" ry="36" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="1000" y="397" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">Monitor</text>
  <line x1="870" y1="390" x2="911" y2="390" stroke="currentColor" stroke-width="2" marker-end="url(#d01pipe-arr)"/>
  <text x="892" y="440" font-size="14" text-anchor="middle" fill="currentColor">every T</text>
  <rect x="1110" y="365" width="85" height="50" fill="none" stroke-width="2" style="stroke: var(--deck-hl)"/>
  <text x="1152" y="396" font-size="15" font-weight="700" text-anchor="middle" fill="currentColor">Display</text>
  <line x1="1085" y1="390" x2="1106" y2="390" stroke="currentColor" stroke-width="2" marker-end="url(#d01pipe-arr)"/>

  <!-- legend -->
  <ellipse cx="45" cy="410" rx="28" ry="14" fill="none" stroke="currentColor" stroke-width="2"/>
  <text x="85" y="415" font-size="14" fill="currentColor">process</text>
  <rect x="17" y="436" width="56" height="26" fill="none" stroke-width="2" style="stroke: var(--deck-hl)"/>
  <text x="85" y="454" font-size="14" fill="currentColor">data</text>
</svg>
