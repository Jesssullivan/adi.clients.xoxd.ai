apiVersion: v1
kind: Namespace
metadata:
  name: adi-sms
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: adi-sms
spec:
  hard: # the hosted quota
    pods: '14'
    requests.cpu: '2'
    requests.memory: 2Gi
    limits.cpu: '8'
    limits.memory: 6Gi
---
# The hosted boundary: ingress on the web port from cloudflared pods and from this namespace; egress to cluster
# DNS and this namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adi-sms-boundary
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull # empty on kind: the image is loaded into the node, never pulled
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{}}'
