; Grafana behind overlay/server.py at /grafana on the deck's hostname, which Cloudflare Access gates. Viewers are
; anonymous with the Viewer role, no admin user exists, and nothing calls out of the namespace.
[server]
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true
enable_gzip = true

[security]
allow_embedding = true
disable_initial_admin_creation = true
disable_gravatar = true

[auth]
disable_login_form = true

[auth.basic]
enabled = false

[auth.anonymous]
enabled = true
org_role = Viewer
hide_version = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
preinstall_disabled = true
plugin_admin_enabled = false
public_key_retrieval_disabled = true
; Every bundled data source but Prometheus runs as its own process otherwise; dashboard sms needs only Prometheus.
disable_plugins = elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin

[unified_alerting]
enabled = false

[live]
max_connections = 0

[public_dashboards]
enabled = false

[cloud_migration]
enabled = false

[dashboards]
min_refresh_interval = 1s
default_home_dashboard_path = /etc/grafana/dashboards/sms.json
