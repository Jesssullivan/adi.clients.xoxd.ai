# Prometheus and Grafana share one pod, so web, this pod, a run's queue and producer pods and P_MAX = 10 sender pods
# fill the namespace quota of 14 pods. Prometheus listens on 127.0.0.1 only, for Grafana in the same pod. The grafana Service is the relay's upstream
# (ADI_GRAFANA in overlay/server.py). Prometheus reaches the web Service and cluster DNS, which the boundary allows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate # a rollout adds no surge pod against the quota, and the data is in emptyDir anyway
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      serviceAccountName: grafana # its own account, with no Role, so the deploy group's policy can pin it
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --storage.tsdb.retention.size=256MB
            - --web.listen-address=127.0.0.1:9090
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 256Mi }
          securityContext:
            runAsUser: 65534 # nobody; the image names it, and the restricted check needs a number
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: prometheus-config, mountPath: /etc/prometheus }
            - { name: prometheus-data, mountPath: /prometheus }
        - name: grafana
          image: docker.io/grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /grafana/api/health
              port: http
            periodSeconds: 5
          # The 520 MB binary's pages count against the limit. At 512Mi its heap left them no room, so Grafana stalled
          # on page faults, failed this probe and the relay answered 502. GOMEMLIMIT makes Go collect before the limit.
          env:
            - { name: GOMEMLIMIT, value: 640MiB }
          resources:
            requests: { cpu: 10m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          securityContext:
            runAsUser: 472 # the image's grafana user
            runAsGroup: 472
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: grafana-config, mountPath: /etc/grafana }
            - { name: grafana-data, mountPath: /var/lib/grafana }
            - { name: grafana-tmp, mountPath: /tmp } # each datasource plugin, Prometheus too, opens its socket here
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus
        - name: prometheus-data
          emptyDir: { sizeLimit: 512Mi }
        - name: grafana-config
          configMap:
            name: grafana
            items:
              - { key: grafana.ini, path: grafana.ini }
              - { key: datasources.yaml, path: provisioning/datasources/prometheus.yaml }
              - { key: dashboards.yaml, path: provisioning/dashboards/sms.yaml }
              - { key: sms.json, path: dashboards/sms.json }
        - name: grafana-data
          emptyDir: { sizeLimit: 256Mi }
        - { name: grafana-tmp, emptyDir: { sizeLimit: 16Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
